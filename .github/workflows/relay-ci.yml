name: relay-ci

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"

defaults:
  run:
    working-directory: relay

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # proto/dlp-proto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

  proto-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: relay/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: dlp-proto 서브모듈에서 gRPC 스텁 생성
        run: bash scripts/gen_proto.sh

      - name: pytest
        # dlp-server/OpenAI/Gemini 실제 연결 없이 도는 단위 테스트만 (fail-closed 경로 포함)
        run: FAIL_CLOSED=true python -m pytest -q